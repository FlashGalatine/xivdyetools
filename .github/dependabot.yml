version: 2

updates:
  # npm dependencies (pnpm monorepo — root handles all workspaces)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: 15
    groups:
      # Group minor/patch updates together to reduce PR noise
      production-deps:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 15
    reviewers:
      - FlashGalatine

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: 15
    open-pull-requests-limit: 5
    reviewers:
      - FlashGalatine
    # FINDING-009 (2026-08-21 security audit): every `uses:` is now pinned to a
    # full commit SHA with the version as a trailing comment; Dependabot bumps
    # the SHA and keeps the comment in sync. The former pnpm/action-setup
    # major-version ignore is gone — pnpm 11 is stable and `packageManager`
    # is pnpm@11.17.0, so the v6 bootstrap concern no longer applies.
