name: Deploy API Worker

# MONO2: api-worker was live on data.xivdyetools.app with no deploy workflow
# (research/monorepo-2.0/05 §5). Modeled on deploy-universalis-proxy.yml.
on:
  push:
    branches: [main, master]
    paths:
      - 'apps/api-worker/**'
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - 'packages/rate-limiter/**'
      - 'packages/worker-middleware/**'
      - '.github/workflows/deploy-api-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-api-worker...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-api-worker

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-api-worker

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api-worker
          command: deploy --env production
          packageManager: pnpm

      # ARCH-002 convention: verify the deployed worker responds
      - name: Smoke test (health check)
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors \
            -H "User-Agent: xivdyetools-ci" \
            https://data.xivdyetools.app/health
