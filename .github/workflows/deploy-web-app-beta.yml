# Deploys the BETA web app (Pages project xivdyetools-beta, served at
# beta.xivdyetools.app) on any push to a non-main branch.
#
# Safe by construction: this is a SEPARATE Pages project from production's
# `xivdyetools`. There is no flag on this workflow that could reach production,
# which is the reason a second project was chosen over a preview branch of the
# existing one. See docs/superpowers/specs/2026-08-09-beta-web-app-deployment-design.md
#
# `--branch=beta` matters: the project was created with
# `--production-branch=beta`, so this is a *production* deployment of the beta
# project and is therefore what the custom domain serves. Deploying under any
# other branch name lands as a preview and the custom domain keeps serving the
# previous build - a silent no-op.
#
# There is ONE beta site. Concurrent branches share it, so the most recent push
# wins; cancel-in-progress makes that explicit rather than a race.
name: Deploy Beta Web App

on:
  push:
    branches-ignore:
      - main
      - master
      # Dependency bumps should not seize beta from whoever is testing on it.
      - 'dependabot/**'
    paths:
      - 'apps/web-app/**'
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - 'packages/svg/**'
  workflow_dispatch:

concurrency:
  group: deploy-web-app-beta
  # Unlike production, a superseded beta deploy is worth cancelling: the newer
  # commit is the one being tested.
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Beta Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-web-app...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-web-app

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-web-app --continue

      - name: Build beta web app
        run: pnpm --filter xivdyetools-web-app run build
        env:
          VITE_APP_ENV: beta

      # ARCH-004: Verify bundle sizes stay within acceptable limits
      - name: Check bundle sizes
        run: pnpm --filter xivdyetools-web-app exec node scripts/check-bundle-size.js

      # Fails the job before deploy if VITE_APP_ENV did not take effect. Without
      # this, a mis-set variable publishes a build indistinguishable from
      # production onto the beta domain, indexable and unmarked.
      - name: Verify this is a beta build
        run: pnpm --filter xivdyetools-web-app exec node scripts/check-beta-build.js

      - name: Deploy to Cloudflare Pages (beta project)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-app
          command: pages deploy dist --project-name=xivdyetools-beta --branch=beta
          packageManager: pnpm

      # ARCH-002: Verify the deployment responds.
      #
      # Asserted against the immutable per-deployment URL, NOT beta.xivdyetools.app.
      # The custom domain is a mutable alias that keeps serving the PREVIOUS
      # deployment until propagation finishes, so asserting there measures the wrong
      # build (a pass proves only that *something* is up), and it 522s while the alias
      # is cold. The latter is how this step failed on the beta project's first-ever
      # deploy: a Pages custom domain has no origin at all until the project's first
      # production deployment exists.
      #
      # There is deliberately NO X-Robots-Tag assertion here. Cloudflare injects
      # `x-robots-tag: noindex` onto every *.pages.dev hostname itself, so asserting
      # it on this URL passes even when vite-plugin-beta-branding never ran - a
      # tautology, not a check. The header is only build-determined on the custom
      # domain. Asserting it there requires first proving the domain has caught up to
      # this deployment; that is scripts/smoke-test-pages.js (see the 2026-08-10 spec).
      - name: Smoke test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler-action returned no deployment-url; nothing to smoke test"
            exit 1
          fi
          echo "Smoke testing $DEPLOY_URL"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w 'deployment responded %{http_code}\n' \
            -H 'User-Agent: xivdyetools-ci' "$DEPLOY_URL/"

      # The custom domain is a distinct failure mode from the deployment: the alias
      # can lag, or be detached from the project entirely. Budgeted at ~2min rather
      # than the deployment check's ~30s because alias propagation is the slow part.
      - name: Smoke test the custom domain
        run: |
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w 'beta.xivdyetools.app responded %{http_code}\n' \
            -H 'User-Agent: xivdyetools-ci' \
            https://beta.xivdyetools.app/
