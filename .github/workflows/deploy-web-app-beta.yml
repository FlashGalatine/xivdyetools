# Deploys the BETA web app (Pages project xivdyetools-beta, served at
# beta.xivdyetools.app) on a push to a non-main branch whose own changes touch the
# web app or one of its packages (the `changes` job below says what "own" means).
#
# Safe by construction: this is a SEPARATE Pages project from production's
# `xivdyetools`. There is no flag on this workflow that could reach production,
# which is the reason a second project was chosen over a preview branch of the
# existing one. See docs/superpowers/specs/2026-08-09-beta-web-app-deployment-design.md
#
# `--branch=beta` matters: the project was created with
# `--production-branch=beta`, so this is a *production* deployment of the beta
# project and is therefore what the custom domain serves. Deploying under any
# other branch name lands as a preview and the custom domain keeps serving the
# previous build - a silent no-op.
#
# There is ONE beta site, shared by every branch, and two concurrency groups decide
# who holds it. Per ref, at workflow level: a newer push cancels its own branch's
# older run, guard included, so two quick pushes no longer race to deploy.
# Shared, on the deploy job: the deploy that starts last cancels any other
# branch's deploy in progress.
name: Deploy Beta Web App

on:
  push:
    branches-ignore:
      - main
      - master
      # Dependency bumps should not seize beta from whoever is testing on it.
      - 'dependabot/**'
    paths:
      - 'apps/web-app/**'
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - 'packages/svg/**'
      # BUG-153: root inputs that change a bundle without touching apps/ or packages/
      # (a lockfile or pnpm override bump of a bundled transitive, the shared tsconfig).
      # Cost: a lockfile-only dependency bump redeploys this worker even when the
      # bump was dev-only; accepted, because a redeploy of identical code is
      # idempotent and cheap, whereas a runtime fix that never ships is not.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      # Never bundled, so an edit to these alone does not start a deploy. Not `*.md`
      # wholesale: this build reads apps/web-app/CHANGELOG-laymans.md into What's New,
      # and discord-worker bundles its own for /changelog. Keep these two lines last:
      # a later positive pattern would match the files again.
      - '!**/CLAUDE.md'
      - '!**/README.md'
  workflow_dispatch:

# Per ref (see the header). Never shared across branches: a run whose `changes` job
# skips the deploy would then cancel another branch's deploy in progress.
concurrency:
  group: deploy-web-app-beta-${{ github.ref }}
  cancel-in-progress: true

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

jobs:
  # The push filter above sees only the pushed commits, so merging main into a
  # branch starts this workflow whenever main changed the web app, even if the
  # branch never did, and the deploy would take the shared beta site from whoever
  # is testing on it. This job compares the branch with its merge base on main
  # instead: the deploy runs only when the branch's own changes touch a deploy
  # path. CLAUDE.md and README.md are never bundled, so they do not count.
  changes:
    name: Check this branch changes the web app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge base needs main's history, not only the pushed commit.
          fetch-depth: 0

      - name: Compare the branch with main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # on.push.paths as git pathspecs; scripts/check-workflows.test.ts keeps the two in step.
          DEPLOY_PATHS: apps/web-app packages/core packages/types packages/logger packages/svg pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json
        run: |
          # A manual run is a deliberate request to deploy this ref.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! base=$(git merge-base origin/main HEAD); then
            echo "::warning::No merge base with main; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # DEPLOY_PATHS is unquoted on purpose: one pathspec per word.
          if git diff --quiet "$base" HEAD -- $DEPLOY_PATHS ':(exclude,glob)**/CLAUDE.md' ':(exclude,glob)**/README.md'; then
            echo "::notice::This branch changes nothing the web app bundles, relative to main (merge base ${base:0:8}); skipping the beta deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build & Deploy Beta Web App
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    # The shared group sits on this job, not the workflow, so a run that skips its
    # deploy never joins it and cannot cancel another branch's deploy in progress.
    concurrency:
      group: deploy-web-app-beta
      # Unlike production, a superseded beta deploy is worth cancelling: the newer
      # commit is the one being tested.
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FINDING-028 (2026-08-29 security audit): beta authenticates with its own
    # CLOUDFLARE_API_TOKEN_BETA, scoped to this `beta` environment, instead of
    # the repository-wide token production uses. Deploys fail on purpose until
    # the maintainer creates both — see docs/operations/DEPLOY_ENVIRONMENTS.md.
    environment: beta
    env:
      # S12-R8 (FINDING-028 fix round 1): lets the guard step below fail fast,
      # by name, before wrangler's own error names the wrong variable.
      HAS_BETA_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA != '' }}
    steps:
      # S12-R8 (fix round 1, FINDING-028): wrangler's own auth failure names
      # CLOUDFLARE_API_TOKEN — the env var, not CLOUDFLARE_API_TOKEN_BETA, the
      # secret actually unset — and an empty apiToken is silently omitted from
      # the action's `with:` echo. Without this, the failure reads like "wrong
      # token" and invites pointing this job at the production secret instead,
      # which is exactly what FINDING-028 closed. Fail here, by name, first.
      - name: Guard against a missing beta Cloudflare token
        if: env.HAS_BETA_CF_TOKEN != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN_BETA is unset on the 'beta' GitHub environment (Settings -> Environments -> beta). This deploy cannot authenticate. Create it per docs/operations/OPEN_ITEMS.md section 1 (history: docs/historical/20260828-PostMerge5.0/POST_MERGE_CHECKLIST.md section 0) -- do NOT reuse CLOUDFLARE_API_TOKEN, the production credential (FINDING-028)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-web-app...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-web-app

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-web-app --continue

      - name: Build beta web app
        run: pnpm --filter xivdyetools-web-app run build
        env:
          VITE_APP_ENV: beta

      # ARCH-004: Verify bundle sizes stay within acceptable limits
      - name: Check bundle sizes
        run: pnpm --filter xivdyetools-web-app exec node scripts/check-bundle-size.js

      # Fails the job before deploy if VITE_APP_ENV did not take effect. Without
      # this, a mis-set variable publishes a build indistinguishable from
      # production onto the beta domain, indexable and unmarked.
      - name: Verify this is a beta build
        run: pnpm --filter xivdyetools-web-app exec node scripts/check-beta-build.js

      - name: Deploy to Cloudflare Pages (beta project)
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-app
          command: pages deploy dist --project-name=xivdyetools-beta --branch=beta
          packageManager: pnpm

      # ARCH-002: Verify the deployment we just made is live on the public URL as
      # a beta build. See docs/superpowers/specs/2026-08-10-pages-smoke-test-design.md
      # for why the robots assertion cannot live on the *.pages.dev alias, and why
      # a check against beta.xivdyetools.app alone can pass against the old build.
      - name: Smoke test
        # Not `pnpm --filter xivdyetools-web-app exec`: that form prints "No
        # projects matched the filters" and exits 0 when the filter matches
        # nothing, so a future filter typo would silently turn this gate into a
        # passing no-op. A direct node invocation cannot do that.
        working-directory: apps/web-app
        run: >
          node scripts/smoke-test-pages.js
          --deployment-url "${{ steps.deploy.outputs.deployment-url }}"
          --domain https://beta.xivdyetools.app
          --expect-robots noindex
