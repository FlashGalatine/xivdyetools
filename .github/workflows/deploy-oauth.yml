name: Deploy OAuth Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/oauth/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      # MONO2: auth itself was missing; plus worker-middleware (research/monorepo-2.0/05 §5)
      - 'packages/auth/**'
      - 'packages/worker-kit/**'
      # BUG-153: root inputs that change a bundle without touching apps/ or packages/
      # (a lockfile or pnpm override bump of a bundled transitive, the shared tsconfig).
      # Cost: a lockfile-only dependency bump redeploys this worker even when the
      # bump was dev-only; accepted, because a redeploy of identical code is
      # idempotent and cheap, whereas a runtime fix that never ships is not.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

concurrency:
  group: deploy-oauth
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OAuth Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FINDING-009: bind production deploys/publishes to the `production` GitHub
    # environment so branch restrictions / required reviewers can gate them.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-oauth-worker...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-oauth-worker

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-oauth-worker

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/oauth
          command: deploy
          packageManager: pnpm

      # ARCH-002: Verify deployed worker responds after deployment
      - name: Smoke test (health check)
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors \
            -H "User-Agent: xivdyetools-ci" \
            https://auth.xivdyetools.app/health
