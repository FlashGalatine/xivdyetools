name: Deploy Presets API

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/presets-api/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - 'packages/auth/**'
      # MONO2: worker-middleware appeared in no deploy filter (research/monorepo-2.0/05 §5)
      - 'packages/worker-kit/**'
  workflow_dispatch:

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

concurrency:
  group: deploy-presets-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Presets API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FINDING-009: bind production deploys/publishes to the `production` GitHub
    # environment so branch restrictions / required reviewers can gate them.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-presets-api...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-presets-api

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-presets-api

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/presets-api
          command: deploy --env production
          packageManager: pnpm

      # ARCH-002: Verify deployed worker responds after deployment
      - name: Smoke test (health check)
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors \
            -H "User-Agent: xivdyetools-ci" \
            https://api.xivdyetools.app/health
