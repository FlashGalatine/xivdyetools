# Deploys the BETA OG worker (xivdyetools-og-worker-dev) on a push to a
# non-main branch whose own changes touch og-worker or one of its packages
# (the `changes` job below says what "own" means).
#
# Safe because of docs/operations/DEPLOY_ENVIRONMENTS.md: a bare `wrangler deploy`
# targets the top-level env, which is the beta worker — its own Worker name, its
# own analytics dataset, and routes confined to beta.xivdyetools.app plus its own
# og-beta.xivdyetools.app image host. Production is reachable only via
# `--env production`, which this workflow never passes.
#
# Note this differs from the beta Discord bot in one respect: the beta OG worker
# IS publicly routed, on real hostnames. It cannot reach production, but it is
# not a private sandbox either.
#
# There is ONE beta worker, shared by every branch, and two concurrency groups
# decide who holds it. Per ref, at workflow level: a newer push cancels its own
# branch's older run, guard included, so two quick pushes no longer race to
# deploy. Shared, on the deploy job: the deploy that starts last cancels any other
# branch's deploy in progress.
name: Deploy Beta OG Worker

on:
  push:
    branches-ignore:
      - main
      - master
      # Dependency bumps should not seize beta from whoever is testing on it.
      - 'dependabot/**'
    paths:
      - 'apps/og-worker/**'
      - 'packages/core/**'
      - 'packages/types/**'
      - 'packages/logger/**'
      - 'packages/svg/**'
      - 'packages/worker-kit/**'
      # BUG-153: root inputs that change a bundle without touching apps/ or packages/
      # (a lockfile or pnpm override bump of a bundled transitive, the shared tsconfig).
      # Cost: a lockfile-only dependency bump redeploys this worker even when the
      # bump was dev-only; accepted, because a redeploy of identical code is
      # idempotent and cheap, whereas a runtime fix that never ships is not.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      # Never bundled, so an edit to these alone does not start a deploy. Not `*.md`
      # wholesale: kept in step with the other beta workflows, whose builds bundle a
      # CHANGELOG-laymans.md. Keep these two lines last: a later positive pattern
      # would match the files again.
      - '!**/CLAUDE.md'
      - '!**/README.md'
  workflow_dispatch:

# Per ref (see the header). Never shared across branches: a run whose `changes` job
# skips the deploy would then cancel another branch's deploy in progress.
concurrency:
  group: deploy-og-worker-beta-${{ github.ref }}
  cancel-in-progress: true

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

jobs:
  # The push filter above sees only the pushed commits, so merging main into a
  # branch starts this workflow whenever main changed og-worker, even if the
  # branch never did, and the deploy would take the shared beta worker from
  # whoever is testing on it. This job compares the branch with its merge base on
  # main instead: the deploy runs only when the branch's own changes touch a
  # deploy path. CLAUDE.md and README.md are never bundled, so they do not count.
  changes:
    name: Check this branch changes og-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge base needs main's history, not only the pushed commit.
          fetch-depth: 0

      - name: Compare the branch with main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # on.push.paths as git pathspecs; scripts/check-workflows.test.ts keeps the two in step.
          DEPLOY_PATHS: apps/og-worker packages/core packages/types packages/logger packages/svg packages/worker-kit pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json
        run: |
          # A manual run is a deliberate request to deploy this ref.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! base=$(git merge-base origin/main HEAD); then
            echo "::warning::No merge base with main; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # DEPLOY_PATHS is unquoted on purpose: one pathspec per word.
          if git diff --quiet "$base" HEAD -- $DEPLOY_PATHS ':(exclude,glob)**/CLAUDE.md' ':(exclude,glob)**/README.md'; then
            echo "::notice::This branch changes nothing og-worker bundles, relative to main (merge base ${base:0:8}); skipping the beta deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Beta OG Worker
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    # The shared group sits on this job, not the workflow, so a run that skips its
    # deploy never joins it and cannot cancel another branch's deploy in progress.
    concurrency:
      group: deploy-og-worker-beta
      # Unlike production, a superseded beta deploy is worth cancelling: the newer
      # commit is the one being tested.
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FINDING-028 (2026-08-29 security audit): beta authenticates with its own
    # CLOUDFLARE_API_TOKEN_BETA, scoped to this `beta` environment, instead of
    # the repository-wide token production uses. Deploys fail on purpose until
    # the maintainer creates both — see docs/operations/DEPLOY_ENVIRONMENTS.md.
    environment: beta
    env:
      # S12-R8 (FINDING-028 fix round 1): lets the guard step below fail fast,
      # by name, before wrangler's own error names the wrong variable.
      HAS_BETA_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA != '' }}
    steps:
      # S12-R8 (fix round 1, FINDING-028): wrangler's own auth failure names
      # CLOUDFLARE_API_TOKEN — the env var, not CLOUDFLARE_API_TOKEN_BETA, the
      # secret actually unset — and an empty apiToken is silently omitted from
      # the action's `with:` echo. Without this, the failure reads like "wrong
      # token" and invites pointing this job at the production secret instead,
      # which is exactly what FINDING-028 closed. Fail here, by name, first.
      - name: Guard against a missing beta Cloudflare token
        if: env.HAS_BETA_CF_TOKEN != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN_BETA is unset on the 'beta' GitHub environment (Settings -> Environments -> beta). This deploy cannot authenticate. Create it per docs/operations/OPEN_ITEMS.md section 1 (history: docs/historical/20260828-PostMerge5.0/POST_MERGE_CHECKLIST.md section 0) -- do NOT reuse CLOUDFLARE_API_TOKEN, the production credential (FINDING-028)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-og-worker...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-og-worker

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-og-worker

      # Bare `deploy` = the top-level env = the beta worker. Never add --env here.
      - name: Deploy beta worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/og-worker
          command: deploy
          packageManager: pnpm

      # Retries are generous because the FIRST deploy provisions the
      # og-beta.xivdyetools.app custom domain — DNS and the edge certificate can
      # take a couple of minutes to become resolvable. Later runs answer at once.
      - name: Smoke test (health check)
        run: |
          sleep 5
          curl --fail --retry 6 --retry-delay 20 --retry-all-errors \
            -H "User-Agent: xivdyetools-ci" \
            https://og-beta.xivdyetools.app/health

      # The regression this exists for: og-worker once emitted og:image URLs
      # missing the /og/ prefix its image routes register under, so every card
      # 404'd. A health check stayed green throughout — nothing verified that
      # the URL in the metadata was one the worker would actually serve. This
      # follows the emitted URL end to end, which is the only way to catch it.
      - name: Smoke test (emitted card URL resolves)
        run: |
          set -euo pipefail
          # dye=1 is a stainID (Snow White), NOT an item ID. The generator
          # degrades an unrecognised dye to the default card rather than
          # failing, so an item-ID-era value here would still emit a valid URL
          # and quietly test nothing. The default-card assertion below is what
          # holds that honest.
          # Two pages: a 5.0-core tool and one of the three 5.0 net-new tools.
          # The second exists because their crawler HTML once emitted the ROOT
          # default card for every share URL (og-worker audit 2026-08-18,
          # DEAD-001) — a harmony-only check was green throughout.
          check_page() {
          PAGE="$1"
          HTML=$(curl -sS --fail --retry 3 --retry-delay 10 --retry-all-errors \
            -A "Mozilla/5.0 (compatible; Discordbot/2.0; +https://discordapp.com)" \
            "$PAGE")

          CARD=$(printf '%s' "$HTML" \
            | grep -o 'property="og:image" content="[^"]*"' \
            | sed 's/.*content="//; s/"$//')

          if [ -z "$CARD" ]; then
            echo "::error::No og:image tag emitted for $PAGE"
            printf '%s\n' "$HTML" | head -40
            exit 1
          fi
          echo "Emitted og:image → $CARD"

          case "$CARD" in
            https://og-beta.xivdyetools.app/og/*) ;;
            *)
              echo "::error::Beta emitted a card URL outside its own image host: $CARD"
              exit 1
              ;;
          esac

          # A fully-specified share link must render a DATA card. Falling back
          # to default.png here means the dye lookup silently failed — the
          # shape a stainID/itemID regression takes, and invisible to any check
          # that only asks whether some PNG came back.
          case "$CARD" in
            *default.png*)
              echo "::error::Data-bearing share URL degraded to the default card: $CARD"
              exit 1
              ;;
          esac

          TYPE=$(curl -sS --fail --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{content_type}' "$CARD")
          echo "Card content-type → $TYPE"

          case "$TYPE" in
            image/png*) ;;
            *)
              echo "::error::Emitted card did not resolve to a PNG (got '$TYPE')"
              exit 1
              ;;
          esac
          }

          check_page "https://beta.xivdyetools.app/harmony/?dye=1&harmony=tetradic"
          # dye=102 is Jet Black (stainID); the budget card is stainID-keyed too
          check_page "https://beta.xivdyetools.app/budget/?dye=102"
