name: Publish Packages to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (or "all-modified" to detect & publish all)'
        required: true
        type: choice
        options:
          - all-modified
          - '@xivdyetools/types'
          - '@xivdyetools/logger'
          - '@xivdyetools/auth'
          - '@xivdyetools/core'
          - '@xivdyetools/svg'
          - '@xivdyetools/bot-logic'
          - '@xivdyetools/worker-kit'

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

jobs:
  detect:
    name: Detect packages to publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Detect unpublished packages
        id: detect
        run: |
          if [ "${{ inputs.package }}" != "all-modified" ]; then
            echo 'packages=["${{ inputs.package }}"]' >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "Selected single package: ${{ inputs.package }}"
            exit 0
          fi

          echo "Scanning all packages for unpublished versions..."
          echo ""

          # Tier-ordered list — dependencies are always published before dependents
          TIER_ORDER=(
            "@xivdyetools/types"
            "@xivdyetools/logger"
            "@xivdyetools/auth"
            "@xivdyetools/core"
            "@xivdyetools/worker-kit"
            "@xivdyetools/svg"
            "@xivdyetools/bot-logic"
          )

          TO_PUBLISH=()
          for pkg in "${TIER_ORDER[@]}"; do
            dir_name="${pkg#@xivdyetools/}"
            local_version=$(jq -r .version "packages/${dir_name}/package.json")
            npm_version=$(npm view "$pkg" version 2>/dev/null || echo "NOT_FOUND")

            if [ "$local_version" != "$npm_version" ]; then
              echo "  ✚ $pkg — $npm_version → $local_version"
              TO_PUBLISH+=("\"$pkg\"")
            else
              echo "  ✓ $pkg — already at $local_version"
            fi
          done

          echo ""

          if [ ${#TO_PUBLISH[@]} -eq 0 ]; then
            echo "No packages need publishing."
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            json_list="[$(IFS=,; echo "${TO_PUBLISH[*]}")]"
            echo "Will publish ${#TO_PUBLISH[@]} package(s): $json_list"
            echo "packages=$json_list" >> "$GITHUB_OUTPUT"
            echo "count=${#TO_PUBLISH[@]}" >> "$GITHUB_OUTPUT"
          fi

  # FINDING-049: dependency/build/test/pack code never receives the npm OIDC identity.
  build:
    name: Build, Test & Pack
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (with dependencies)
        env:
          PACKAGES_JSON: ${{ needs.detect.outputs.packages }}
        run: |
          FILTER_ARGS=()
          for pkg in $(echo "$PACKAGES_JSON" | jq -r '.[]'); do
            FILTER_ARGS+=("--filter=${pkg}...")
          done
          pnpm turbo run build "${FILTER_ARGS[@]}"

      - name: Test
        env:
          PACKAGES_JSON: ${{ needs.detect.outputs.packages }}
        run: |
          FILTER_ARGS=()
          for pkg in $(echo "$PACKAGES_JSON" | jq -r '.[]'); do
            FILTER_ARGS+=("--filter=${pkg}")
          done
          pnpm turbo run test "${FILTER_ARGS[@]}"

      - name: Pack and bind release metadata
        env:
          PACKAGES_JSON: ${{ needs.detect.outputs.packages }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          for pkg in $(echo "$PACKAGES_JSON" | jq -r '.[]'); do
            dir_name="${pkg#@xivdyetools/}"
            pnpm --filter "$pkg" pack --out "$RUNNER_TEMP/release/${dir_name}.tgz"
          done
          node --experimental-strip-types scripts/publish-packages.ts manifest "$RUNNER_TEMP/release"

      - name: Upload release tarballs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify & Publish Tarballs
    needs: [detect, build]
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Helper and expected manifests come from reviewed source, never the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.17.0
          run_install: false

      - name: Download this run's immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release/
          digest-mismatch: error

      # Native pnpm 11 OIDC, with no setup-node registry credential placeholder.
      # All archive verification completes before publishing starts; lifecycle
      # scripts are disabled and pnpm runs outside the checkout in an empty cwd.
      - name: Verify identities, versions, hashes and publish
        env:
          PACKAGES_JSON: ${{ needs.detect.outputs.packages }}
        run: node --experimental-strip-types scripts/publish-packages.ts publish "$RUNNER_TEMP/release"
