name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Advisories are published continuously, but this workflow only ran when
  # somebody pushed -- so one landing during a quiet stretch went unseen until
  # the next PR. The nightly run closes that gap. Only the `audit` job takes
  # part (see the `if` on `ci` below).
  #
  # Daily, not hourly: `minimumReleaseAge: 1440` in pnpm-workspace.yaml forbids
  # installing a patch published in the last 24h, so detecting faster than
  # daily surfaces nothing that can be acted on yet.
  #
  # 11:17 UTC ~ 07:17 in the maintainer's -0400, so a failure notification is
  # waiting at the start of the day. The offset minute is deliberate:
  # top-of-hour crons queue behind everyone else's and start late.
  #
  # Reminder: GitHub runs schedules only from the DEFAULT branch's copy of this
  # file, so edits here do nothing until they land on main. GitHub also
  # disables scheduled workflows after 60 days without repository activity.
  schedule:
    - cron: '17 11 * * *'

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ARCH-003: Scan production dependencies for known vulnerabilities.
  #
  # Its own job on purpose. As a step inside `ci` it sat ahead of lint,
  # type-check, test and build, so a newly published advisory against a
  # dependency nobody touched would have stopped all four from running --
  # a broken PR and a clean one would have shown the same red X. It was
  # therefore pinned to continue-on-error, which made a critical advisory
  # (GHSA-mv8w-475r-vwqw, found 2026-08-12) invisible in a green-looking run.
  # Split out, the two signals are independent: this job can fail loudly
  # without costing any test coverage signal.
  #
  # Note for whoever hits this red: `minimumReleaseAge: 1440` in
  # pnpm-workspace.yaml means a patch published in the last 24h cannot be
  # installed, so a same-day advisory may have no permitted fix yet. That is
  # the intended trade -- wait it out, or add a dated minimumReleaseAgeExclude.
  audit:
    name: Security audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod --audit-level high

  # FINDING-030 (2026-08-21 security audit): secret scanning in CI. On push /
  # pull_request the action scans exactly the commits of the event (the
  # pre-commit detect-secrets config it replaces never ran anywhere). Rules +
  # allowlist live in `.gitleaks.toml` at the repo root. This is a personal-
  # account repository, so no GITLEAKS_LICENSE is required. GitHub's own
  # secret scanning + push protection (repo settings) is the complement that
  # covers full history and blocks pushes.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The action diffs the event's commit range, so it needs history.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # contents: read only — PR comments would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  ci:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every turbo filter below is '...[HEAD^]'. On the nightly schedule that
    # resolves to whatever the last merge happened to touch, so this job would
    # re-run an arbitrary slice of the suite against an unchanged tree. The
    # schedule exists for the audit alone.
    if: github.event_name != 'schedule'
    steps:
      # fetch-depth: 2 is load-bearing -- every turbo filter below is
      # '...[HEAD^]' and needs the previous commit present to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (affected)
        run: pnpm turbo run lint --filter='...[HEAD^]'

      - name: Type-check (affected)
        run: pnpm turbo run type-check --filter='...[HEAD^]'

      # --concurrency=3: when a change touches every package (docs sweeps,
      # formatting passes), the affected filter selects all ~34 test tasks and
      # turbo's default concurrency of 10 runs that many vitest processes --
      # each with its own worker pool -- on a 2-core runner. Under that load a
      # vitest child gets silently killed and the task fails with exit 1 and no
      # assertion failure (observed on the 2026-07-28 docs sweep, three runs in
      # a row, @xivdyetools/core#test dying mid-run). Narrow diffs are
      # unaffected; wide sweeps get bounded parallelism instead of an OOM.
      - name: Test (affected)
        run: pnpm turbo run test --filter='...[HEAD^]' --continue --concurrency=3

      - name: Build (affected)
        run: pnpm turbo run build --filter='...[HEAD^]'

      # ARCH-004: Report bundle sizes for built packages
      - name: Report bundle sizes
        if: always()
        run: |
          echo "## 📦 Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Package | JS Output | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          for dir in apps/*/dist packages/*/dist; do
            if [ -d "$dir" ]; then
              name=$(echo "$dir" | sed 's|/dist||')
              js_bytes=$(find "$dir" \( -name '*.js' -o -name '*.mjs' \) -exec cat {} + 2>/dev/null | wc -c)
              if [ "$js_bytes" -gt 0 ]; then
                js_human=$(numfmt --to=iec "$js_bytes")
                if [ "$js_bytes" -gt 5242880 ]; then
                  echo "| $name | $js_human | ⚠️ >5 MiB |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| $name | $js_human | ✅ |" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            fi
          done
