name: Deploy Image Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/image-worker/**'
      - 'packages/logger/**'
      - 'packages/worker-kit/**'
  workflow_dispatch:

# FINDING-009 (2026-08-21 security audit): least-privilege GITHUB_TOKEN —
# the default repo token is never needed beyond checkout here. Jobs that need
# more (npm OIDC publish) declare it at job level.
permissions:
  contents: read

concurrency:
  group: deploy-image-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Image Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # FINDING-009: bind production deploys/publishes to the `production` GitHub
    # environment so branch restrictions / required reviewers can gate them.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-image-worker...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-image-worker

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-image-worker

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/image-worker
          command: deploy --env production
          packageManager: pnpm

      # No smoke test here (unlike its siblings): image-worker has
      # workers_dev = false and no routes in production — it is reachable
      # ONLY via service binding from discord-worker, so there is no public
      # URL to curl. See docs/operations/IMAGE_WORKER_SPLIT.md.
