name: Deploy Image Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/image-worker/**'
      - 'packages/logger/**'
      - 'packages/worker-kit/**'
  workflow_dispatch:

concurrency:
  group: deploy-image-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Image Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo run build --filter=xivdyetools-image-worker...

      - name: Type-check
        run: pnpm turbo run type-check --filter=xivdyetools-image-worker

      - name: Test
        run: pnpm turbo run test --filter=xivdyetools-image-worker

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/image-worker
          command: deploy --env production
          packageManager: pnpm

      # No smoke test here (unlike its siblings): image-worker has
      # workers_dev = false and no routes in production — it is reachable
      # ONLY via service binding from discord-worker, so there is no public
      # URL to curl. See docs/operations/IMAGE_WORKER_SPLIT.md.
