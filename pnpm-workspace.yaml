packages:
  - 'packages/*'
  - 'apps/*'

# Dependency overrides (moved from package.json#pnpm.overrides — pnpm 11 no
# longer reads that field). typescript keeps the workspace on one compiler;
# rollup, qs and seroval are security floors.
overrides:
  typescript: ^5.9.3
  rollup: '>=4.59.0'
  qs: '>=6.15.2'
  # GHSA-mv8w-475r-vwqw (critical): seroval.fromJSON() Promise resolver type
  # confusion invokes attacker-controlled methods during deserialization.
  # Reaches us only transitively, via stoat-worker > revolt.js > solid-js, and
  # seroval-plugins peers on `^1.0` so the floor satisfies it unchanged.
  seroval: '>=1.5.3'

# Explicit build-script policy (pnpm 11 `allowBuilds` map — replaces the
# pnpm 10 onlyBuiltDependencies/ignoredBuiltDependencies pair): no dependency
# is approved to run install scripts. The three below are deliberately
# rejected (the whole workspace builds and tests green with their postinstalls
# skipped — esbuild ships platform binaries via optionalDependencies, msw's
# script is only its sponsorship notice, and nothing spawns workerd at install
# time). A future dependency that adds an install script is NOT silently
# covered: pnpm surfaces it for review.
allowBuilds:
  esbuild: false
  msw: false
  workerd: false

# Supply-chain policy: pnpm 11 enables minimumReleaseAge by default; pin it
# explicitly (minutes) so the policy is visible in the repo. New releases must
# be at least 24 h old before install — a window in which compromised releases
# are typically detected and yanked.
minimumReleaseAge: 1440
# (The one-off `minimumReleaseAgeExclude: [postcss]` carried here for the
# 8.5.24 release expired on 2026-07-29 and was removed on 2026-08-10. There is
# no standing exclusion — add one only with a dated expiry note like that.)
