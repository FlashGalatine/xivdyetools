      - link "The RYB wheel is how most of us were introduced to colors, it's beautiful, and even sometimes useful. Before color codes and standardized inks, artists had to rely on whatever pigments they could get their hands on. Mixing them allowed them to produce a large variety of colors. And so, the color wheel was a great guide on observing how mixing what with what would produce." [ref=f17e25] [cursor=pointer]:
