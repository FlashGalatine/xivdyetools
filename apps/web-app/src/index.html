<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XIV Dye Tools - FFXIV Dye Color Matcher, Harmony Generator & Accessibility Checker</title>
    <meta
      name="description"
      content="XIV Dye Tools - A comprehensive web-based toolset for Final Fantasy XIV players to explore dye colors, create harmonious color palettes, match colors from images, and simulate how dye combinations appear to colorblind players."
    />
    <meta name="keywords" content="FFXIV, dyes, color matcher, color harmony, accessibility checker, dye comparison, dye mixer, glamour, housing decoration, fashion, Final Fantasy XIV" />
    <meta name="author" content="Flash Galatine (Midgardsormr)" />
    <meta name="robots" content="index, follow" />
    <!-- 5.0 identity: #CE2222 light / #EA4133 dark. Media-scoped rather than one
         compromise value, so browser chrome matches the theme either way. -->
    <meta name="theme-color" content="#CE2222" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#EA4133" media="(prefers-color-scheme: dark)" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://xivdyetools.app/" />
    
    <!-- Open Graph / Social embeds -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xivdyetools.app/" />
    <meta property="og:title" content="XIV Dye Tools - FFXIV Dye Color Matcher, Harmony Generator & Accessibility Checker" />
    <meta property="og:description" content="Free tools for FFXIV players: Color Matcher, Harmony Generator, Accessibility Checker, Dye Comparison, and Dye Mixer. Find perfect dyes for your glamour and housing." />
    <!-- The 5.0 root card. og-worker intercepts the nine /<tool>/ paths and emits
         its own og:image; the site root is not in its route table, so this static
         pair is the root's only card. Filenames and the 1200×1050 / 1200×630 frame
         split mirror og-worker's /og/default.png and ?frame=x exactly. -->
    <meta property="og:image" content="https://xivdyetools.app/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1050" />
    <meta property="og:image:alt" content="XIV Dye Tools - icons for the nine FFXIV dye tools on a dark panel, over a six-color spectrum" />
    <meta property="og:site_name" content="XIV Dye Tools" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X embeds -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AsheJunius" />
    <meta name="twitter:creator" content="@AsheJunius" />
    <meta name="twitter:url" content="https://xivdyetools.app/" />
    <meta name="twitter:title" content="XIV Dye Tools - FFXIV Color Utilities" />
    <meta name="twitter:description" content="Free FFXIV dye color tools: matching, harmony, accessibility, comparison, and mixing utilities for glamour design." />
    <!-- X gets the 1200×630 frame, matching og-worker's ?frame=x variant. -->
    <meta name="twitter:image" content="https://xivdyetools.app/og/default-x.png" />
    <meta name="twitter:image:alt" content="XIV Dye Tools - icons for the nine FFXIV dye tools over a six-color spectrum" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512x512.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#CE2222" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Resource Hints for Performance -->
    <!-- No font origins here: the typefaces are self-hosted from /fonts/ (REFACTOR-002). -->
    <link rel="dns-prefetch" href="https://universalis.app" />
    <link rel="preconnect" href="https://universalis.app" crossorigin />
    <!-- XIV Dye Tools API subdomains -->
    <link rel="dns-prefetch" href="https://auth.xivdyetools.app" />
    <link rel="dns-prefetch" href="https://api.xivdyetools.app" />
    <link rel="dns-prefetch" href="https://data.xivdyetools.app" />
    <link rel="preconnect" href="https://auth.xivdyetools.app" crossorigin />
    <link rel="preconnect" href="https://api.xivdyetools.app" crossorigin />
    <link rel="preconnect" href="https://data.xivdyetools.app" crossorigin />
    <!--
      Self-hosted typefaces (REFACTOR-002). The @font-face blocks live in
      styles/globals.css, but vite-plugin-async-css defers the stylesheet to keep
      it off the render path, so the browser would not discover the faces until
      that CSS has loaded and parsed. These two preloads start the fetches
      immediately instead; both render above the fold. Fragment Mono is left to
      the stylesheet -- numeric readouts only appear once a tool has mounted.
      `crossorigin` is required even though these are same-origin: fonts are
      always fetched in CORS mode, and a preload whose mode differs from the real
      request is discarded and fetched twice.
    -->
    <link rel="preload" href="/fonts/Onest-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
