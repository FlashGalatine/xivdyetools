# DEPLOY_ENVIRONMENTS (docs/operations/DEPLOY_ENVIRONMENTS.md): the default
# (top-level) env is a separate dev worker with its own name and NO routes, so
# a plain `wrangler deploy` can never overwrite the production moderation bot.
# Production config lives exclusively under [env.production] and ships via
# `wrangler deploy --env production`.
#
# `routes` and `workers_dev` are INHERITABLE keys: a named environment takes
# the top-level value unless it overrides it. `routes` therefore MOVED into
# [env.production] — leaving it here would attach the production custom
# domains to the dev worker.
name = "xivdyetools-moderation-worker-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# ARCH-001: nodejs_compat removed — no Node.js APIs used
# No reachable dev URL is needed: nothing binds to the dev worker, and the
# moderation bot's interactions endpoint points at the production domain.
workers_dev = false

[[kv_namespaces]]
binding = "KV"
id = "1fcb7e037ccd4172a47fccd97cf8e753"

[[d1_databases]]
binding = "DB"
database_name = "xivdyetools-presets"
database_id = "e17d68a1-5a44-4c88-b02b-07d053cbe321"

[[services]]
binding = "PRESETS_API"
service = "xivdyetools-presets-api"

# FINDING-003: native Workers Rate Limiting bindings (per Discord user): command 20+5, autocomplete 60+10 per 60 s.
[[ratelimits]]
name = "RL_COMMAND"
namespace_id = "1033"
simple = { limit = 25, period = 60 }

[[ratelimits]]
name = "RL_AUTOCOMPLETE"
namespace_id = "1034"
simple = { limit = 70, period = 60 }

[vars]
# FINDING-013 (2026-08-29 security audit): which deployment this is.
# `validateEnv` requires RL_COMMAND / RL_AUTOCOMPLETE only when this reads
# "production", so it must be declared in BOTH blocks — vars are not
# inheritable, and a production deploy without the line would skip the check.
# On this routeless dev worker "development" also switches on the `isDev` arm
# of the global error handler (src/index.ts), which adds the message and stack
# to a 500 body; nothing is routed here and workers_dev is false, so that body
# is only ever seen by a `wrangler dev` session.
ENVIRONMENT = "development"
DISCORD_CLIENT_ID = "1453806659708129374"
PRESETS_API_URL = "https://api.xivdyetools.app"

# Secrets: DISCORD_TOKEN, DISCORD_PUBLIC_KEY, BOT_API_SECRET,
# BOT_SIGNING_SECRET, MODERATOR_IDS, MODERATION_CHANNEL_ID,
# SUBMISSION_LOG_CHANNEL_ID

[env.production]
name = "xivdyetools-moderation-worker"
routes = [
  { pattern = "moderation-bot.xivdyetools.app", custom_domain = true },
  { pattern = "moderation-bot.xivdyetools.projectgalatine.com", custom_domain = true }
]

[env.production.vars]
# FINDING-013: turns on validateEnv's production block (RL_COMMAND and
# RL_AUTOCOMPLETE become required). See the top-level [vars] comment — vars are
# NOT inheritable, so this must be repeated here.
ENVIRONMENT = "production"
DISCORD_CLIENT_ID = "1453806659708129374"
PRESETS_API_URL = "https://api.xivdyetools.app"

[[env.production.kv_namespaces]]
binding = "KV"
id = "1fcb7e037ccd4172a47fccd97cf8e753"

[[env.production.d1_databases]]
binding = "DB"
database_name = "xivdyetools-presets"
database_id = "e17d68a1-5a44-4c88-b02b-07d053cbe321"

[[env.production.services]]
binding = "PRESETS_API"
service = "xivdyetools-presets-api"

# FINDING-003: production per-user rate-limit bindings
[[env.production.ratelimits]]
name = "RL_COMMAND"
namespace_id = "1031"
simple = { limit = 25, period = 60 }

[[env.production.ratelimits]]
name = "RL_AUTOCOMPLETE"
namespace_id = "1032"
simple = { limit = 70, period = 60 }
