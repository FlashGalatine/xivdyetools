# DEPLOY_ENVIRONMENTS (docs/operations/DEPLOY_ENVIRONMENTS.md): the default
# (top-level) env is the BETA bot — its own Worker name, its own Discord
# application, its own KV namespace, and NO routes — so a plain
# `wrangler deploy` can never overwrite the production bot on
# bot.xivdyetools.app. Production config lives exclusively under
# [env.production] and ships via `wrangler deploy --env production`.
#
# `routes` and `workers_dev` are INHERITABLE keys: a named environment takes
# the top-level value unless it overrides it. Both are therefore declared
# explicitly in both environments — leaving `routes` up here would attach the
# production custom domains to the beta Worker.
name = "xivdyetools-discord-worker-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# ARCH-001: nodejs_compat removed — no Node.js APIs used
workers_dev = true

# Beta bot: isolated KV so testing never touches real users' preferences,
# favorites, rate-limit counters or analytics. The service bindings are
# shared with production on purpose, so /preset renders real data.
[[kv_namespaces]]
binding = "KV"
id = "7d76d17fbb16403c8bf40e16f5b58ba6"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "xivdyetools_bot_analytics_beta"

[[services]]
binding = "PRESETS_API"
service = "xivdyetools-presets-api"

[[services]]
binding = "UNIVERSALIS_PROXY"
service = "xivdyetools-api-worker"

[[services]]
binding = "IMAGE_WORKER"
service = "xivdyetools-image-worker"

# FINDING-007 (2026-08-29 security audit): native Workers Rate Limiting
# bindings now own the per-user command counters, which used to live in a
# third-party Redis. Each `[[ratelimits]]` entry is ONE fixed { limit, period },
# so there is one tier per distinct effective limit (maxRequests +
# burstAllowance) in worker-kit's DISCORD_COMMAND_LIMITS. worker-kit picks the
# smallest bound tier whose limit is >= the command's effective limit, so these
# six cover every entry of the preset exactly. namespace_id is unique per
# account — >= 1041 is this worker's reserved range (1001-1034 belong to the
# other four workers).
[[ratelimits]]
name = "RL_5"
namespace_id = "1051"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_10"
namespace_id = "1052"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_15"
namespace_id = "1053"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "RL_20"
namespace_id = "1054"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_30"
namespace_id = "1055"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_70"
namespace_id = "1056"
simple = { limit = 70, period = 60 }

[vars]
# The BETA Discord application — separate from production because an
# application has exactly one Interactions Endpoint URL.
DISCORD_CLIENT_ID = "1536085517270261771"
PRESETS_API_URL = "https://api.xivdyetools.app"
ANNOUNCEMENT_CHANNEL_ID = "1441800851747508314"

# Secrets: DISCORD_TOKEN, DISCORD_PUBLIC_KEY, BOT_API_SECRET,
# BOT_SIGNING_SECRET
# Beta needs only DISCORD_TOKEN + DISCORD_PUBLIC_KEY. Rate limiting needs no
# secret at all: it runs on the `RL_*` bindings above and falls back to KV
# only when no tier is bound (tests / local dev without bindings).

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# /changelog bundles apps/discord-worker/CHANGELOG-laymans.md as a string at
# deploy time (src/types/markdown.d.ts types the import; vitest mirrors the
# rule with vitest.markdown-plugin.ts). Editing that file is therefore a deploy.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# ============================================================================
# PRODUCTION — the live bot. Deployed only via `wrangler deploy --env production`.
# ============================================================================
[env.production]
name = "xivdyetools-discord-worker"
workers_dev = false
routes = [
  { pattern = "bot.xivdyetools.app", custom_domain = true },
  { pattern = "bot.xivdyetools.projectgalatine.com", custom_domain = true }
]

[env.production.vars]
DISCORD_CLIENT_ID = "1447108133020369048"
PRESETS_API_URL = "https://api.xivdyetools.app"
# vars are NOT inheritable — this must be repeated here or the GitHub
# release-announcement webhook loses its target channel.
ANNOUNCEMENT_CHANNEL_ID = "1434357606008356874"
# Production release-announcement channel — deliberately different from the
# top-level (beta) value above; 2026-08-29 the 5.0 announcement went to the beta
# channel because this line had been copied from it.

[[env.production.kv_namespaces]]
binding = "KV"
id = "1fcb7e037ccd4172a47fccd97cf8e753"

[[env.production.services]]
binding = "PRESETS_API"
service = "xivdyetools-presets-api"

[[env.production.services]]
binding = "UNIVERSALIS_PROXY"
service = "xivdyetools-api-worker"

[[env.production.services]]
binding = "IMAGE_WORKER"
service = "xivdyetools-image-worker"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "xivdyetools_bot_analytics"

# FINDING-007: the same six tiers as the top-level block (see the comment
# there). `ratelimits` is NOT inheritable, and each environment needs its own
# namespace_ids so beta traffic can never consume production's allowance.
[[env.production.ratelimits]]
name = "RL_5"
namespace_id = "1041"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_10"
namespace_id = "1042"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_15"
namespace_id = "1043"
simple = { limit = 15, period = 60 }

[[env.production.ratelimits]]
name = "RL_20"
namespace_id = "1044"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "RL_30"
namespace_id = "1045"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "RL_70"
namespace_id = "1046"
simple = { limit = 70, period = 60 }
