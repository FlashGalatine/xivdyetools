name = "xivdyetools-oauth"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# ARCH-001: nodejs_compat removed — no Node.js APIs used

routes = [
  { pattern = "auth.xivdyetools.app", custom_domain = true },
  { pattern = "auth.xivdyetools.projectgalatine.com", custom_domain = true }
]

[dev]
port = 8788
local_protocol = "http"

[vars]
ENVIRONMENT = "production"
DISCORD_CLIENT_ID = "1447108133020369048"
XIVAUTH_CLIENT_ID = "phx-sXZeb_Ran6GAdcnsnjvdtOeNM4df0BZyF3Jyti0"
FRONTEND_URL = "https://xivdyetools.app"
WORKER_URL = "https://auth.xivdyetools.app"
JWT_EXPIRY = "3600"

# FINDING-003: native Workers Rate Limiting bindings for /auth/* (one per OAUTH_LIMITS value, per IP+path, 60 s).
# Top-level block = PRODUCTION for this worker. namespace_id unique per account.
[[ratelimits]]
name = "RL_AUTH_10"
namespace_id = "1021"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_20"
namespace_id = "1022"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AUTH_30"
namespace_id = "1023"
simple = { limit = 30, period = 60 }

# FINDING-029 (2026-08-21 security audit): the former `[env.preview]`
# (xivdyetools-oauth-preview / auth-preview.xivdyetools.app) was deleted. It
# bound the PRODUCTION D1 + KV behind a stale pages.dev FRONTEND_URL and, with
# ENVIRONMENT = "preview", sat outside every fail-closed gate — one
# `wrangler deploy --env preview` away from a second token issuer on production
# data. `development` is the only non-production environment; the worker's
# env validation now rejects any ENVIRONMENT other than development/production.

[env.development]
name = "xivdyetools-oauth-dev"
vars = { ENVIRONMENT = "development", DISCORD_CLIENT_ID = "1447108133020369048", XIVAUTH_CLIENT_ID = "phx-sXZeb_Ran6GAdcnsnjvdtOeNM4df0BZyF3Jyti0", FRONTEND_URL = "http://localhost:5173", WORKER_URL = "http://localhost:8788", JWT_EXPIRY = "3600" }

[[kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "0d6f3be3b4704e91a83e6387b9769e45"

[[env.development.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "891bbbe834ba4055a06b672b589094be"
preview_id = "3d9eafa9aac64f18a1e9c56b228b4b68"

[[d1_databases]]
binding = "DB"
database_name = "xivdyetools-users"
database_id = "6e97b759-70dd-49a8-a93c-0541c7fe6c67"

[[env.development.d1_databases]]
binding = "DB"
database_name = "xivdyetools-users-dev"
# To populate: run `wrangler d1 create xivdyetools-users-dev` and paste the returned UUID here.
# Local `wrangler dev` works without this (uses .wrangler/state/ SQLite); only needed for --remote ops.
# FINDING-029: still a placeholder — create the database (or drop this env block) before any
# `wrangler deploy --env development`; it must never point at the production database id.
database_id = "TODO_RUN_WRANGLER_D1_CREATE"

# Secrets: DISCORD_CLIENT_SECRET, JWT_SECRET, XIVAUTH_CLIENT_SECRET

# FINDING-003: development env rate-limit bindings
[[env.development.ratelimits]]
name = "RL_AUTH_10"
namespace_id = "1024"
simple = { limit = 10, period = 60 }

[[env.development.ratelimits]]
name = "RL_AUTH_20"
namespace_id = "1025"
simple = { limit = 20, period = 60 }

[[env.development.ratelimits]]
name = "RL_AUTH_30"
namespace_id = "1026"
simple = { limit = 30, period = 60 }
